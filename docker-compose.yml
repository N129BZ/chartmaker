services:
  # Ensure host mount directories are owned by the local user instead of root
  init-perms:
    image: busybox
    command: chown -R ${UID:-1000}:${GID:-1000} /data/chartcache /data/mbtiles /data/workarea
    restart: "no"
    volumes:
      - ./chartcache:/data/chartcache
      - ./mbtiles:/data/mbtiles
      - ./workarea:/data/workarea

  # Web server container - launch with: docker compose up -d chartmaker
  chartmaker:
    image: ghcr.io/n129bz/chartmaker:latest
    container_name: chartmaker
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    depends_on:
      init-perms:
        condition: service_completed_successfully
    ports:
      - "8500:8500"
    volumes:
      - ./chartcache:/chartmaker/chartcache
      - ./mbtiles:/chartmaker/mbtiles
      - ./workarea:/chartmaker/workarea
      - .:/chartmaker/config
    environment:
      - DOCKER=true
      - TZ=America/Chicago
      - WEBSERVER=true
      
  # Interactive CLI container - launch with: docker compose run --rm chartmaker-cli
  chartmaker-cli:
    image: ghcr.io/n129bz/chartmaker:latest
    container_name: chartmaker-cli
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    tty: true
    restart: "no"
    depends_on:
      init-perms:
        condition: service_completed_successfully
    volumes:
      - ./chartcache:/chartmaker/chartcache
      - ./mbtiles:/chartmaker/mbtiles
      - ./workarea:/chartmaker/workarea
      - .:/chartmaker/config
    environment:
      - DOCKER=true
      - TZ=America/Chicago
      - WEBSERVER=false
