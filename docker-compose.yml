services:
  chartmaker:
    image: ghcr.io/your_github_username/chartmaker:latest
    container_name: chartmaker
    restart: unless-stopped
    ports:
      - "8500:8500" 
    volumes:
      - ./chartcache:/chartmaker/chartcache
      - ./externalcharts:/chartmaker/externalcharts
      - ./externalsettings:/chartmaker/externalsettings
    environment:
      - DOCKER=true
      - TZ=America/Chicago