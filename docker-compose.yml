services:
  chartmaker:
    image: ghcr.io/n129bz/chartmaker:latest
    container_name: chartmaker
    restart: unless-stopped
    ports:
      - "8500:8500" 
    volumes:
      - ./chartcache:/chartmaker/chartcache
      - ./charts:/chartmaker/charts
      - .:/chartmaker/config
      - /:/host
    environment:
      - DOCKER=true
      - TZ=America/Chicago
      - HOST_HOME=${HOME}
      - HOST_PWD=${PWD}
