services:
  chartmaker:
    build: .                                  
    image: ghcr.io/n129bz/chartmaker:latest
    container_name: chartmaker
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true                          
    tty: true                                 
    restart: "no"                             
    ports:
      - "8500:8500" 
    volumes:
      - ./chartcache:/chartmaker/chartcache
      - ./mbtiles:/chartmaker/mbtiles
      - .:/chartmaker/config
    environment:
      - DOCKER=true
      - TZ=America/Chicago