version: '3.8'

services:
  chartmaker:
    image: ghcr.io/n129bz/chartmaker:latest
    container_name: chartmaker
    stdin_open: true # Keeps STDIN open (equivalent to -i)
    tty: true        # Allocates a pseudo-TTY (equivalent to -t)
    command: ["node", "make.js"]
    restart: unless-stopped
    ports:
      - "8500:8500" # HTTP UI
    volumes:
      # Persistent cache for downloaded FAA zip archives (avoids re-downloading)
      - ./chartcache:/chartmaker/chartcache
      # Host output directory for finished .mbtiles
      - ./externalcharts:/chartmaker/externalcharts
      # Configuration
      - ./externalsettings:/chartmaker/externalsettings
    environment:
      - DOCKER=true
      - TZ=America/Chicago
